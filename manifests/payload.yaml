schema_version: 1
# Payload manifest template for hello (spec 03; filled from recipe.yml by tools/stage)
identity:
  schema_version: 1
  kind: toolkit
  name: "@@NAME@@"
  version: "@@VERSION@@"
  producer: {tool: feedstock-build, tool_version: "1"}
  created: "@@CREATED@@"
  source: {src_sha256: "@@UPSTREAM_SHA256@@", commit: "@@FEEDSTOCK_SHA@@", builder: "gha"}
  digest:
    tree_hash: ""        # merkle root when the CAS lands (spec 03)
    blob_sha256: "@@BLOB_SHA256@@"
  signing: {state: unsigned}
  encryption: {state: none}
  annotations: {}
provides:
  executables:
    # stage appends the platform's exe suffix to the path (.exe on
    # windows-ucrt — the image carries the PE name; empty elsewhere).
    # The path keeps the literal tool name: the name and suffix
    # placeholders would share an @ at the junction and break the fill.
    - {name: "@@NAME@@", path: "/bin/hello@@EXE_SUFFIX@@", version: "@@VERSION@@"}
  libraries: []
  platforms: @@PLATFORMS@@
  capabilities: {exec: true, read: true}
requires: []             # toolkit deps: {kind: toolkit, name, constraint, mount}
