name: build-payload
# Feedstock build: recipe → matrix build → boot-smoke → release.
# Conventions: docs/conventions.md in tebako-packages/index.
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

# One run per branch/PR-head at a time: pushing to a branch with an open
# PR would otherwise run every job twice (push + pull_request events);
# a new run cancels the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  matrix:
    name: emit
    runs-on: ubuntu-24.04
    outputs:
      legs: ${{ steps.m.outputs.legs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: m
        run: |
          # The matrix is EMITTED from recipe.yml (YAML stays thin;
          # logic lives in tools/). tools/emit_matrix emits one leg per
          # (version × platform) in the recipe.
          echo "legs=$(ruby tools/emit_matrix recipe.yml)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.legs) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up MSys2 (ucrt64 toolchain)
        if: matrix.platform == 'x86_64-windows-ucrt'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: ucrt64
          path-type: minimal
          update: true
          # THE windows toolchain (the same ucrt64 gcc family the ruby
          # runtime factory uses — never choco gcc) + the msys-side tools
          # the feedstock scripts call (git apply, tar, curl, make) and
          # the ucrt64 ruby recipe_query runs on. configure finds the
          # toolchain's libintl/libiconv (NLS on); tools/build links the
          # windows leg -static so hello.exe needs no non-OS DLLs.
          install: >-
            git
            tar
            curl
            make
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-ruby
      - name: Build ${{ matrix.version }} (${{ matrix.platform }})
        if: matrix.platform != 'x86_64-windows-ucrt'
        run: tools/build recipe.yml "${{ matrix.version }}" "${{ matrix.platform }}"
      - name: Build ${{ matrix.version }} (${{ matrix.platform }}, ucrt64)
        if: matrix.platform == 'x86_64-windows-ucrt'
        # the matrix context is not available to step-level `shell`, so
        # the windows leg gets its own step with the literal msys2 keyword
        shell: msys2 {0}
        run: tools/build recipe.yml "${{ matrix.version }}" "${{ matrix.platform }}"
      - name: Boot-smoke
        # Hard rule (docs/conventions.md): the packaged tool's --version
        # runs from the image before any release publishes.
        if: matrix.platform != 'x86_64-windows-ucrt'
        run: tools/boot_smoke "out/${{ matrix.platform }}"
      - name: Boot-smoke (ucrt64)
        if: matrix.platform == 'x86_64-windows-ucrt'
        shell: msys2 {0}
        run: tools/boot_smoke "out/${{ matrix.platform }}"
      - name: Stage artifact
        if: matrix.platform != 'x86_64-windows-ucrt'
        run: tools/stage "out/${{ matrix.platform }}" "${{ matrix.platform }}"
      - name: Stage artifact (ucrt64)
        if: matrix.platform == 'x86_64-windows-ucrt'
        shell: msys2 {0}
        run: tools/stage "out/${{ matrix.platform }}" "${{ matrix.platform }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.platform }}
          path: dist/

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish payloads + registry
        # artifacts per triplet + SHA256SUMS + the resolved tpkg-registry.yaml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/publish
