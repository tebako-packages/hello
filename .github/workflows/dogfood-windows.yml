name: dogfood-windows
# The permanent windows dogfood for the smallest fixture (the tiered-e2e
# doctrine): install the PUBLISHED hello payload with a tebako CLI + shim
# on a real windows runner and run it end-to-end — the exact persona-A
# path a windows user walks. Nothing here builds the payload; the payload
# is always the released, sha256-pinned artifact.
#
#   tebako add-registry tfs:github:tebako-packages/hello
#   tebako install hello
#   ~/.tebako/shims/hello.exe            -> "Hello, world!"
#
# The CLI under test is, by default, the published tamatebako/tebako
# release (sha256-pinned below — that release ships no SHA256SUMS asset).
# With the `tebako_ref` input the CLI+shim are instead BUILT from that
# tamatebako/tebako ref through the repo's own ci/windows-gnu-release.sh
# (the release leg's own script, import gate included) — the pre-release
# verification loop for product PRs.
#
# workflow_dispatch only: this is a dogfood of published artifacts, not a
# gate on this repo's own builds (build-payload.yml is that). The push
# trigger below exists ONLY while this workflow is being iterated on its
# branch (a workflow is dispatchable via the API only once it exists on
# the default branch); it is removed before merge.
on:
  workflow_dispatch:
    inputs:
      tebako_version:
        description: 'Published tamatebako/tebako release to dogfood (ignored when tebako_ref is set)'
        default: '0.1.1'
      tebako_ref:
        description: 'tamatebako/tebako ref to BUILD the CLI+shim from instead of downloading a release'
        # ITERATION ONLY: the fix branch under test (tamatebako/tebako#367).
        # Revert to '' before merge so the permanent dogfood defaults to the
        # published release.
        default: 'fix/windows-exec-chain'
  push:
    branches: [ci/dogfood-windows]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Expected digests of the published v0.1.1 assets (computed from the
  # published assets at authoring time; that release ships no SHA256SUMS).
  TEBAKO_CLI_SHA256: "9cd4f2e0922acb776797a284f2f3ea1448f93c228c92e84b0f1f7a322857c2b8"
  TEBAKO_SHIM_SHA256: "ab5af866718ae0f6ec280092471bc397f640a69aeb03cba7cbc3bd1a1ae1bbbc"
  # The CLI's own log grammar (crates/tebako-log): TEBAKO_DEBUG=<level>.
  TEBAKO_DEBUG: "debug"
  # The product CI's vcpkg pin (tamatebako/tebako .github/workflows env).
  VCPKG_COMMIT: f14401ca0f2754347c3864da7488a9b955b4e47a
  # ITERATION ONLY (this branch's push trigger): the inputs context is
  # EMPTY on push events (defaults apply to workflow_dispatch only), so
  # the effective ref/version carry their fallbacks inline. The fix branch
  # under test is tamatebako/tebako#367. Before merge, the ref fallback
  # reverts to '' (published release) — keep the version fallback.
  EFFECTIVE_TEBAKO_REF: ${{ inputs.tebako_ref || 'fix/windows-exec-chain' }}
  EFFECTIVE_TEBAKO_VERSION: ${{ inputs.tebako_version || '0.1.1' }}

jobs:
  dogfood:
    name: install + run hello (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ---- source the CLI: published release (default) -------------------
      - name: Download tebako + tebako-shim (windows-ucrt64, pinned sha256)
        if: ${{ env.EFFECTIVE_TEBAKO_REF == '' }}
        shell: bash
        env:
          TEBAKO_VERSION: ${{ env.EFFECTIVE_TEBAKO_VERSION }}
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/tebako-bin"
          mkdir -p "$BIN"
          cd "$BIN"
          BASE="https://github.com/tamatebako/tebako/releases/download/v${TEBAKO_VERSION}"
          curl -sSfL -o tebako.exe      "${BASE}/tebako-${TEBAKO_VERSION}-windows-ucrt64.exe"
          curl -sSfL -o tebako-shim.exe "${BASE}/tebako-shim-${TEBAKO_VERSION}-windows-ucrt64.exe"
          echo "${TEBAKO_CLI_SHA256}  tebako.exe"      | sha256sum -c -
          echo "${TEBAKO_SHIM_SHA256}  tebako-shim.exe" | sha256sum -c -
          echo "$BIN" >> "$GITHUB_PATH"
          file tebako.exe tebako-shim.exe || true

      # ---- source the CLI: build from a tamatebako/tebako ref ------------
      # The product release leg's own provisioning + script (so the dogfood
      # also exercises the import gate). The path layout mirrors the product
      # CI: tebako-rs/ with the dwarfs-rs/ sibling path dep next to it.
      - name: Checkout tamatebako/tebako @ ${{ env.EFFECTIVE_TEBAKO_REF }}
        if: ${{ env.EFFECTIVE_TEBAKO_REF != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/tebako
          ref: ${{ env.EFFECTIVE_TEBAKO_REF }}
          path: tebako-rs
          submodules: recursive

      - name: Checkout dwarfs-rs (sibling path dep)
        if: ${{ env.EFFECTIVE_TEBAKO_REF != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/dwarfs-rs
          path: dwarfs-rs
          submodules: recursive

      - name: Restore the vcpkg baseline (dwarfs-t is the single writer)
        if: ${{ env.EFFECTIVE_TEBAKO_REF != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash dwarfs-rs/dwarfs-t/ci/vcpkg-baseline-restore.sh \
            dwarfs-rs/dwarfs-t x64-mingw-static \
            || echo "baseline miss — ports build normally"

      - name: Set up MSys2 (ucrt64 toolchain + cmake/ninja)
        if: ${{ env.EFFECTIVE_TEBAKO_REF != '' }}
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: ucrt64
          path-type: minimal
          install: mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-make

      - name: Rust toolchain (windows-gnu target)
        if: ${{ env.EFFECTIVE_TEBAKO_REF != '' }}
        uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1
        with:
          targets: x86_64-pc-windows-gnu

      - name: Set up vcpkg
        if: ${{ env.EFFECTIVE_TEBAKO_REF != '' }}
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgDirectory: ${{ github.workspace }}/.vcpkg-root

      - name: Cache vcpkg package archives
        if: ${{ env.EFFECTIVE_TEBAKO_REF != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-archives-dogfood-${{ github.sha }}-${{ hashFiles('dwarfs-rs/dwarfs-t/vcpkg.json') }}
          restore-keys: vcpkg-archives-dogfood-

      - name: Cache the cargo target dir
        if: ${{ env.EFFECTIVE_TEBAKO_REF != '' }}
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: tebako-rs
          key: dogfood-${{ github.sha }}

      - name: Build the CLI + shim through the product's release script
        if: ${{ env.EFFECTIVE_TEBAKO_REF != '' }}
        working-directory: tebako-rs
        shell: bash
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VERSION: 0.0.0-dogfood
          PLATFORM: windows-ucrt64
        run: |
          set -euo pipefail
          # Builds the five binaries, stages them, and runs the release
          # leg's own import gate over out/*.exe.
          bash ci/windows-gnu-release.sh
          BIN="$RUNNER_TEMP/tebako-bin"
          mkdir -p "$BIN"
          cp "out/tebako-${VERSION}-${PLATFORM}.exe" "$BIN/tebako.exe"
          cp "out/tebako-shim-${VERSION}-${PLATFORM}.exe" "$BIN/tebako-shim.exe"
          echo "$BIN" >> "$GITHUB_PATH"

      - name: Dump vcpkg build logs on failure
        if: ${{ failure() && env.EFFECTIVE_TEBAKO_REF != '' }}
        shell: bash
        run: |
          for f in .vcpkg-root/buildtrees/*/build-x64-mingw-static-*-err.log .vcpkg-root/buildtrees/*/install-x64-mingw-static-*-err.log; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            tail -200 "$f"
          done

      # ---- the dogfood proper ---------------------------------------------
      - name: CLI sanity
        shell: bash
        run: |
          set -x
          tebako --version
          tebako --help || true

      - name: tebako add-registry tfs:github:tebako-packages/hello
        shell: bash
        run: |
          set -x
          tebako add-registry tfs:github:tebako-packages/hello
          tebako list-registries

      - name: tebako install hello
        shell: bash
        run: |
          set -x
          tebako install hello

      - name: Run hello via the shim (the assertion that matters)
        shell: bash
        run: |
          set -euo pipefail
          ls -la "$HOME/.tebako/shims/"
          OUT="$("$HOME/.tebako/shims/hello.exe" 2>&1)"
          echo "$OUT"
          case "$OUT" in
            *"Hello, world!"*) echo "DOGFOOD PASS: shim ran the published payload" ;;
            *) echo "DOGFOOD FAIL: expected 'Hello, world!' in shim output" >&2; exit 1 ;;
          esac

      - name: Run hello --version via the shim
        shell: bash
        run: |
          set -euo pipefail
          OUT="$("$HOME/.tebako/shims/hello.exe" --version 2>&1 | head -1)"
          echo "$OUT"
          case "$OUT" in
            *"2.12"*) echo "DOGFOOD PASS: --version names 2.12" ;;
            *) echo "DOGFOOD FAIL: expected 2.12 in --version output" >&2; exit 1 ;;
          esac

      - name: Probe `tebako run` (package-file surface; expected to refuse a nickname)
        shell: bash
        run: |
          set +e
          tebako run hello
          rc=$?
          echo "tebako run hello -> exit $rc (documented probe; not the install+shim path)"
          exit 0

      - name: Forensics (always)
        if: always()
        shell: bash
        run: |
          set +e
          echo "=== ~/.tebako tree ==="
          find "$HOME/.tebako" -maxdepth 4 | sort
          echo "=== config.yaml ==="
          cat "$HOME/.tebako/config.yaml" 2>/dev/null
          echo "=== journal.log ==="
          cat "$HOME/.tebako/journal.log" 2>/dev/null
          echo "=== shims ==="
          ls -la "$HOME/.tebako/shims/" 2>/dev/null
          echo "=== payloads ==="
          ls -la "$HOME/.tebako/payloads/hello/" 2>/dev/null
          exit 0
